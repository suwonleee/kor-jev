[project]
name = "kor-jev"
version = "0.1.0"
description = "Local Korean typed decisions with Jeff-compatible serving"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "torch==2.14.0", "torchvision==0.29.0", "transformers==5.17.0",
  "pillow==12.3.0", "fastapi==0.141.1", "uvicorn==0.52.4",
  "safetensors==0.8.0", "numpy==2.5.3", "huggingface-hub==1.31.0",
]

[project.optional-dependencies]
mac = ["mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
kor-jev = "kor_jev.cli:main"
jeff-serve = "jeff.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeff", "src/kor_jev"]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
